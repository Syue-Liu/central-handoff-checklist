<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>中控交接清單 — 張榮發基金會</title>
<style>
:root{
  --bg:#eef2f5;--sf:#fffefd;--sf2:#f7f9fb;
  --ink:#172234;--ink2:#22324a;
  --ac:#255aa8;--ac-bg:#eaf1ff;--ac-bd:#b9cdf4;--ac-tx:#1f4d92;
  --ok:#16724c;--ok-bg:#e8f5ef;--ok-bd:#8bd1ad;
  --no:#aa3428;--no-bg:#fdecea;--no-bd:#f2aaa4;
  --wa:#8a5a11;--wa-bg:#fff5df;--wa-bd:#f1c978;
  --pu:#6841a3;--pu-bg:#f1ecfb;--pu-bd:#c9b8ee;
  --tx:#1c2430;--tx2:#667085;--tx3:#a8b0bc;
  --bd:#dce2ea;--bd2:#c9d2dd;
  --shadow:0 12px 30px rgba(23,34,52,.08);
  --shadow-sm:0 5px 16px rgba(23,34,52,.07);
  --r:8px;--rs:7px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111827;--sf:#1d2430;--sf2:#242d3a;--ink:#101826;--ink2:#172234;
  --tx:#f4f7fb;--tx2:#b9c2cf;--tx3:#788394;
  --bd:#303a49;--bd2:#455062;--shadow:0 16px 32px rgba(0,0,0,.24);--shadow-sm:0 8px 18px rgba(0,0,0,.2);
  --ac-bg:#1b3156;--ac-bd:#456fb4;--ac-tx:#9ac1ff;
  --ok-bg:#0f3324;--ok-bd:#2d6b4a;
  --no-bg:#3a1a18;--no-bd:#7a3a36;
  --wa-bg:#3a2800;--wa-bd:#9a6e00;--wa:#e8a020;
  --pu-bg:#2d1b69;--pu-bd:#7c3aed;--pu:#a78bfa;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:linear-gradient(180deg,#f7f4ee 0%,var(--bg) 260px,#e8edf2 100%);color:var(--tx);font-family:-apple-system,'Helvetica Neue','Noto Sans TC',sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}

.hdr{background:linear-gradient(180deg,var(--ink) 0%,var(--ink2) 100%);border-bottom:1px solid rgba(255,255,255,.08);padding:16px 18px 14px;position:sticky;top:0;z-index:100;box-shadow:0 10px 26px rgba(23,34,52,.18)}
.hdr-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:9px;color:#fff;letter-spacing:.02em}
.dot{width:8px;height:8px;border-radius:50%;background:#34c759;box-shadow:0 0 0 4px rgba(52,199,89,.16);flex-shrink:0}
.hdr-sub{font-size:12px;color:rgba(255,255,255,.66);margin-top:4px}

.rnav{background:rgba(248,250,252,.88);border-bottom:1px solid var(--bd);display:flex;gap:8px;padding:10px 18px;position:sticky;top:76px;z-index:90;overflow-x:auto;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.rtab{flex:1;min-width:88px;padding:9px 12px;border:1px solid var(--bd);border-radius:999px;background:rgba(255,255,255,.78);color:var(--tx2);font-size:14px;font-weight:650;cursor:pointer;transition:all .15s;font-family:inherit;box-shadow:0 1px 0 rgba(255,255,255,.8) inset}
.rtab.on{color:#fff;background:var(--ink2);border-color:var(--ink2);font-weight:700;box-shadow:0 8px 18px rgba(23,34,52,.18)}

.main{padding:18px 16px 44px;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.card{background:var(--sf);border:1px solid rgba(201,210,221,.82);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.card-hd{padding:12px 15px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,#fbfcfe 0%,var(--sf2) 100%);display:flex;align-items:center;gap:9px}
.card-ico{width:24px;height:24px;border-radius:7px;background:#eef3f8;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;box-shadow:0 1px 0 rgba(255,255,255,.9) inset}
.card-lbl{font-size:12px;font-weight:750;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
.card-bd{padding:16px;display:flex;flex-direction:column;gap:14px}
.inner-div{height:1px;background:linear-gradient(90deg,transparent,var(--bd),transparent);margin:2px 0}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--tx2);font-weight:650}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--bd2);border-radius:var(--rs);background:#fff;color:var(--tx);font-size:14px;font-family:inherit;transition:border-color .15s,box-shadow .15s,background .15s;-webkit-appearance:none;box-shadow:0 1px 0 rgba(255,255,255,.92) inset}
.field input{min-height:42px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(37,90,168,.13),0 1px 0 rgba(255,255,255,.92) inset;background:#fff}
.field textarea{resize:vertical;min-height:72px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* arrival */
.aopts{display:flex;gap:7px}
.aopt{flex:1;padding:10px 4px;border:1px solid var(--bd2);border-radius:var(--rs);background:#fff;color:var(--tx2);text-align:center;cursor:pointer;transition:all .15s;user-select:none;box-shadow:var(--shadow-sm)}
.aopt-t{font-size:15px;font-weight:600;display:block}
.aopt-s{font-size:11px;opacity:.7;display:block;margin-top:1px}
.aopt.on{background:var(--wa-bg);border-color:var(--wa-bd);color:var(--wa);font-weight:700;box-shadow:0 0 0 3px rgba(138,90,17,.08)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.chip{padding:8px 12px;border:1px solid var(--bd2);border-radius:var(--rs);font-size:13px;color:var(--tx2);cursor:pointer;background:#fff;transition:all .15s;user-select:none;box-shadow:0 1px 0 rgba(255,255,255,.9) inset}
.chip.on{background:var(--ac-bg);border-color:var(--ac-bd);color:var(--ac-tx);font-weight:650;box-shadow:0 0 0 3px rgba(37,90,168,.08)}

/* vendor 3-option */
.vendor-opts{display:flex;flex-direction:column;gap:8px}
.vendor-opt{padding:12px 14px;border:1px solid var(--bd2);border-radius:var(--rs);background:#fff;color:var(--tx2);font-size:14px;font-weight:650;cursor:pointer;transition:all .15s;user-select:none;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-sm)}
.vo-dot{width:8px;height:8px;border-radius:50%;background:var(--bd2);flex-shrink:0;transition:background .15s}
.vendor-opt.v-none{border-color:var(--tx3);color:var(--tx2)}.vendor-opt.v-none .vo-dot{background:var(--tx3)}
.vendor-opt.v-audio{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}.vendor-opt.v-audio .vo-dot{background:var(--ok)}
.vendor-opt.v-sys{background:var(--ac-bg);border-color:var(--ac-bd);color:var(--ac-tx)}.vendor-opt.v-sys .vo-dot{background:var(--ac)}

/* matrix chips */
.pt-mx-block{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.pt-mx-row{border:1px solid var(--ac-bd);border-radius:var(--rs);overflow:hidden;background:#fff;box-shadow:var(--shadow-sm)}
.pt-mx-hd{background:var(--ac-bg);padding:8px 11px;font-size:12px;font-weight:750;color:var(--ac-tx)}
.pt-mx-bd{padding:10px 11px}
.pt-mx-hint{font-size:11px;color:var(--tx3);margin-bottom:5px}
.mx-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mx-chip{padding:7px 5px;border:1px solid var(--bd2);border-radius:6px;font-size:12px;color:var(--tx2);cursor:pointer;background:#fff;transition:all .12s;user-select:none;text-align:center;min-width:0}
.mx-chip .mn{display:block;font-weight:600;font-size:11px;line-height:1.3}
.mx-chip .ml{display:block;font-size:10px;opacity:.65;line-height:1.2}
.mx-chip.on{background:var(--ac-bg);border-color:var(--ac-bd);color:var(--ac-tx);font-weight:650}
.pt-empty{font-size:12px;color:var(--tx3);padding:2px 0;font-style:italic}

/* TV wall */
.tv-modes{display:flex;flex-wrap:wrap;gap:7px}
.tv-chip{padding:8px 12px;border:1px solid var(--bd2);border-radius:var(--rs);font-size:13px;font-weight:650;color:var(--tx2);cursor:pointer;background:#fff;transition:all .15s;user-select:none}
.tv-chip.on{background:var(--ac-bg);border-color:var(--ac-bd);color:var(--ac-tx);box-shadow:0 0 0 3px rgba(37,90,168,.08)}
.group-chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.group-chip{padding:9px 4px;border:1px solid var(--bd2);border-radius:var(--rs);font-size:13px;font-weight:750;color:var(--tx2);cursor:pointer;background:#fff;transition:all .15s;user-select:none;text-align:center}
.group-chip.on{background:var(--pu-bg);border-color:var(--pu-bd);color:var(--pu);box-shadow:0 0 0 3px rgba(104,65,163,.08)}
.relay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.relay-room-grid{display:flex;flex-wrap:wrap;gap:7px}
.relay-main{display:block;font-weight:800;font-size:12px;line-height:1.25}
.relay-sub{display:block;font-size:10px;line-height:1.25;opacity:.72;margin-top:2px}
.relay-custom{display:grid;grid-template-columns:1fr 74px;gap:7px;align-items:center}
.pu-chips{display:flex;flex-wrap:wrap;gap:6px}
.pu-chip{padding:7px 12px;border:1px solid var(--bd2);border-radius:999px;font-size:12px;color:var(--tx2);cursor:pointer;background:#fff;transition:all .15s;user-select:none}
.pu-chip.on{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok);font-weight:650}
.tv-custom{display:flex;align-items:center;gap:7px;margin-top:6px}
.tv-custom span{font-size:12px;color:var(--tx2);white-space:nowrap}

/* light scene chips */
.lt-chips{display:flex;flex-wrap:wrap;gap:6px}
.lt-chip{padding:8px 11px;border:1px solid var(--bd2);border-radius:var(--rs);font-size:13px;font-weight:650;color:var(--tx2);cursor:pointer;background:#fff;transition:all .15s;user-select:none}
.lt-chip.on{background:var(--wa-bg);border-color:var(--wa-bd);color:var(--wa);box-shadow:0 0 0 3px rgba(138,90,17,.08)}

/* scene list */
.scene-list{display:flex;flex-direction:column;gap:8px}
.scene-item{background:#fff;border:1px solid var(--bd);border-radius:var(--rs);padding:11px 12px;display:flex;align-items:flex-start;gap:9px;box-shadow:var(--shadow-sm)}
.scene-num{width:24px;height:24px;border-radius:7px;background:var(--ac-bg);border:1px solid var(--ac-bd);color:var(--ac-tx);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.lt-num{background:var(--wa-bg);border-color:var(--wa-bd);color:var(--wa)}
.scene-body{flex:1;display:flex;flex-direction:column;gap:3px}
.scene-line1{font-size:13px;color:var(--tx);font-weight:500;line-height:1.4}
.scene-line2{font-size:12px;color:var(--tx2)}
.scene-del{border:none;background:transparent;color:var(--tx3);font-size:16px;cursor:pointer;padding:0 2px;line-height:1;transition:color .12s;flex-shrink:0}
.scene-del:hover{color:var(--no)}

/* draft section */
.draft-wrap{display:flex;flex-direction:column;gap:13px;padding-top:4px}
.draft-sep{height:1px;background:var(--bd);margin:4px 0}
.draft-lbl{font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:.4px;text-transform:uppercase;padding-bottom:2px}

/* add buttons */
.btn-add{width:100%;padding:12px;border:1.5px dashed var(--ac-bd);border-radius:var(--rs);background:var(--ac-bg);color:var(--ac-tx);font-size:14px;font-weight:750;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-add:active{opacity:.8}
.btn-add-lt{border-color:var(--wa-bd);background:var(--wa-bg);color:var(--wa)}

/* test info */
.test-card .card-hd{background:var(--pu-bg);border-color:var(--pu-bd)}
.test-card .card-lbl{color:var(--pu)}

/* actions */
.actions{display:flex;flex-direction:column;gap:8px;padding:2px 0 16px}
.btn-copy{width:100%;padding:14px;border:none;border-radius:var(--r);background:var(--ac);color:#fff;font-size:15px;font-weight:750;cursor:pointer;font-family:inherit;transition:opacity .15s,transform .15s;box-shadow:0 10px 22px rgba(37,90,168,.2)}
.btn-copy:active{opacity:.86;transform:translateY(1px)}
.btn-email{background:var(--ok);box-shadow:0 10px 22px rgba(22,114,76,.18)}
.btn-clr{width:100%;padding:10px;border:1px solid var(--bd2);border-radius:var(--rs);background:rgba(255,255,255,.5);color:var(--tx2);font-size:13px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn-clr:hover{background:var(--sf2)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:#1a7a50;color:#fff;padding:11px 22px;border-radius:22px;font-size:14px;font-weight:500;transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap;z-index:999}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:#b03020}

@media(max-width:520px){
  .hdr{padding:15px 16px 13px}
  .rnav{top:73px;padding:9px 12px}
  .main{padding:14px 12px 36px;gap:12px}
  .card-bd{padding:14px}
  .mx-chips{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:380px){
  .row2{grid-template-columns:1fr}
  .group-chips,.relay-grid{grid-template-columns:repeat(3,1fr)}
}

@media(prefers-color-scheme:dark){
  body{background:linear-gradient(180deg,#101826 0%,var(--bg) 280px,#0f1722 100%)}
  .rnav{background:rgba(17,24,39,.88)}
  .rtab,.card,.field input,.field select,.field textarea,.aopt,.chip,.vendor-opt,.pt-mx-row,.mx-chip,.tv-chip,.group-chip,.pu-chip,.lt-chip,.scene-item{background:var(--sf)}
  .card-hd{background:linear-gradient(180deg,#242d3a 0%,var(--sf2) 100%)}
  .card-ico{background:#303a49}
  .card-lbl{color:var(--tx)}
  .btn-clr{background:rgba(36,45,58,.55)}
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="hdr">
  <div class="hdr-title"><span class="dot"></span>中控交接清單</div>
  <div class="hdr-sub">張榮發基金會 · 影音設備交接</div>
</div>

<div class="rnav">
  <button class="rtab on" onclick="sw('1101',this)">1101廳</button>
  <button class="rtab" onclick="sw('1001',this)">1001廳</button>
  <button class="rtab" onclick="sw('801',this)">801廳</button>
</div>

<div class="main" id="form"></div>

<script>
const RM={
  '1101':{label:'1101廳',hasStageLight:true,
    pts:['左側舞台','中側舞台','右側舞台','電視牆後方','後方分配盤','中控室接點'],
    mx:[{n:1,l:'舞台右'},{n:2,l:'電視牆後1'},{n:3,l:'電視牆後2'},{n:4,l:'電視牆後3'},
        {n:5,l:'外接1'},{n:6,l:'外接2'},{n:7,l:'16x16'},{n:8,l:'中控'}],
    tvModes:['全屏','2畫面','3畫面(黑)','3畫面','全:1:全','1:全:1','自訂1','自訂2','自訂3','展示']},
  '1001':{label:'1001廳',hasStageLight:false,
    pts:['左側舞台','右側舞台','第一排座位','後方分配盤'],
    mx:[{n:1,l:'講台右'},{n:2,l:'講台右2'},{n:3,l:'座位區'},{n:4,l:'外接1'},
        {n:5,l:'外接2'},{n:6,l:'外接3'},{n:7,l:'16x16 Out1'},{n:8,l:'中控'}],
    tvModes:['全屏','3畫面(黑)','4畫面(黑)','1:2:1','1:全版:1','3畫面(底)','4畫面','自訂1','自訂2','展示']},
  '801':{label:'801廳',hasStageLight:false,
    pts:['左側舞台','右側舞台','第一排座位','後方分配盤'],
    mx:[{n:1,l:'講台右'},{n:2,l:'講台右2'},{n:3,l:'座位區'},{n:4,l:'外接1'},
        {n:5,l:'外接2'},{n:6,l:'外接3'},{n:7,l:'16x16 Out1'},{n:8,l:'中控'}],
    tvModes:['全屏','3畫面(黑)','4畫面(黑)','1:2:1','1:全版:1','3畫面(底)','4畫面','自訂1','自訂2','展示']}
};
const ARRIVE=[['07:30','提早'],['08:15','提早'],['08:30','正常']];
const TEST_PERSONS=['彥宇','偉偉','佳學','77'];
const BIZ_OWNERS=['沙課','武勇','定洲','vickey','joy','冠輝','三和','瑋平','忠謙'];
const TV_PURPOSES=['簡報','開場','主視覺'];
const TV_GROUPS=[1,2,3,4,5,6].map(n=>`群組${n}`);
const RELAY_INPUTS=[
  {n:1,src:'8x8 OUT-5'},
  {n:2,src:'8x8 OUT-6'},
  {n:3,src:'8x8 OUT-7'},
  {n:4,src:'8x8 OUT-8'},
  {n:5,src:'攝影機'}
];
const RELAY_OUTPUTS=[11,12,13,14,15,16];
const RELAY_ROOMS={
  '1101':['1102','1103','1110a','1110b','1110c','1110d'],
  '1001':['1002','1003','1005','1006','1007'],
  '801':['802','803','810b']
};
const STAGE_SCENES=['全亮','場景一','場景二','場景三','場景四','場景五','場景六','場景七','場景八','全暗'];
const ROOM_SCENES= ['全亮','場景一','場景二','場景三','場景四','場景五','場景六','全暗'];
const VENDOR_OPTS=[
  {k:'none', cls:'v-none',  label:'無廠商'},
  {k:'audio',cls:'v-audio', label:'有廠商・自帶音響'},
  {k:'sys',  cls:'v-sys',   label:'有廠商・接系統'}
];

const LS='av_v8';
let cur='1101';
let st=lod();

function lod(){try{const d=localStorage.getItem(LS);return d?JSON.parse(d):mk()}catch{return mk()}}
function mk(){return{
  '1101':{avScenes:[],avDraft:{},ltScenes:[],ltDraft:{}},
  '1001':{avScenes:[],avDraft:{},ltScenes:[],ltDraft:{}},
  '801': {avScenes:[],avDraft:{},ltScenes:[],ltDraft:{}}
}}
function sav(){try{localStorage.setItem(LS,JSON.stringify(st))}catch{}}
function today(){return new Date().toISOString().split('T')[0]}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}

function S(){return st[cur]}
function AD(){if(!S().avDraft)S().avDraft={};return S().avDraft}
function LD(){if(!S().ltDraft)S().ltDraft={};return S().ltDraft}
function avSc(){if(!S().avScenes)S().avScenes=[];return S().avScenes}
function ltSc(){if(!S().ltScenes)S().ltScenes=[];return S().ltScenes}
function dMx(pt){return(AD().pcMatrix||{})[pt]||[]}

/* ── scene summaries ── */
function avPtsLine(sc){
  const pts=sc.pts||[];
  if(!pts.length)return null;
  return pts.map(pt=>{
    const sel=((sc.pcMatrix||{})[pt]||[]).sort((a,b)=>a-b).map(n=>{
      const m=RM[cur].mx.find(x=>x.n===n);
      return`IN${n}${m&&!m.l.startsWith('IN')?'·'+m.l:''}`;
    });
    return`${pt} → ${sel.length?sel.join(', '):'─'}`;
  }).join('　');
}
function avTvLine(sc){
  return[sc.tvMode,sc.tvPurpose,(sc.tvCustom||'').trim()].filter(Boolean).join(' · ')||null;
}
function avGroupLine(sc){
  const groups=sc.groups||[];
  return groups.length?`套用：${groups.join('、')}`:null;
}
function ltLine(sc){
  const parts=[];
  if(sc.purpose)parts.push(`【${sc.purpose}】`);
  if(RM[cur].hasStageLight&&sc.stageLight)parts.push(`舞台：${sc.stageLight}`);
  if(sc.roomLight)parts.push(`場燈：${sc.roomLight}`);
  return parts.join('　')||'─';
}

/* ── scene list HTML ── */
function avSceneListHtml(){
  const sc=avSc();if(!sc.length)return'';
  return`<div class="scene-list">${sc.map((s,i)=>{
    const l1=avPtsLine(s),l2=avTvLine(s),l3=avGroupLine(s);
    return`<div class="scene-item">
      <div class="scene-num">${i+1}</div>
      <div class="scene-body">
        ${l1?`<div class="scene-line1">${l1}</div>`:''}
        ${l2?`<div class="scene-line2">📺 ${l2}</div>`:''}
        ${l3?`<div class="scene-line2">${l3}</div>`:''}
      </div>
      <button class="scene-del" onclick="delAv(${i})">✕</button>
    </div>`;
  }).join('')}</div><div class="draft-sep"></div>`;
}
function ltSceneListHtml(){
  const sc=ltSc();if(!sc.length)return'';
  return`<div class="scene-list">${sc.map((s,i)=>`
    <div class="scene-item">
      <div class="scene-num lt-num">${i+1}</div>
      <div class="scene-body"><div class="scene-line1">${ltLine(s)}</div></div>
      <button class="scene-del" onclick="delLt(${i})">✕</button>
    </div>`).join('')}</div><div class="draft-sep"></div>`;
}

/* ── draft AV matrix rows ── */
function draftPtRows(){
  const pts=(AD().pts||[]);
  if(!pts.length)return`<div class="pt-empty">選擇接點後，指定矩陣輸入</div>`;
  return`<div class="pt-mx-block">${pts.map(pt=>{
    const sel=dMx(pt);
    return`<div class="pt-mx-row">
      <div class="pt-mx-hd">${pt}</div>
      <div class="pt-mx-bd">
        <div class="pt-mx-hint">8×8 矩陣輸入（可複選）</div>
        <div class="mx-chips">${RM[cur].mx.map(({n,l})=>`
          <div class="mx-chip${sel.includes(n)?' on':''}" data-pt="${pt}" data-n="${n}" onclick="toggleDMx(this)">
            <span class="mn">IN${n}</span><span class="ml">${l}</span>
          </div>`).join('')}</div>
      </div>
    </div>`;
  }).join('')}</div>`;
}
function refreshPtRows(){
  const el=document.getElementById('avpt-rows');if(el)el.innerHTML=draftPtRows();
}

/* ── light scene chips ── */
function ltChips(key,options,draftKey){
  const v=LD()[draftKey]||'';
  return`<div class="lt-chips">${options.map(o=>`
    <div class="lt-chip${v===o?' on':''}" data-k="${draftKey}" data-v="${o}" onclick="setLtChip(this)">${o}</div>`).join('')}</div>`;
}

/* ── vendor HTML ── */
function vendorHtml(){
  const v=S().vendor||'';
  return`<div class="vendor-opts">${VENDOR_OPTS.map(o=>`
    <div class="vendor-opt${v===o.k?' '+o.cls:''}" data-v="${o.k}" onclick="setVendor(this)">
      <div class="vo-dot"></div>${o.label}
    </div>`).join('')}</div>`;
}

function relayInText(v){
  const item=RELAY_INPUTS.find(x=>String(x.n)===String(v));
  return item?`IN${item.n}（${item.src}）`:'─';
}
function relayOutText(v){return v?`OUT${v}`:'─'}
function relayHtml(s){
  return`<div class="card">
    <div class="card-hd"><span class="card-ico">🔁</span><span class="card-lbl">串場需求</span></div>

              <div class="group-chip single-chip${s.relayIn==item.n?' on':''}" data-k="relayIn" data-v="${item.n}" onclick="setSingle(this)">

}

/* ── render ── */

        </div>

    </div>
  </div>

  <div class="card">
    <div class="card-hd"><span class="card-ico">🎬</span><span class="card-lbl">接點 / 電視牆場景</span></div>
    <div class="card-bd">
      ${avSceneListHtml()}

        <div class="field">

          <div class="tv-modes">

              <div class="tv-chip${d.tvMode===m?' on':''}" data-v="${m}" onclick="setDTvMode(this)">${m}</div>`).join('')}

  <div class="card">
    <div class="card-hd"><span class="card-ico">🏭</span><span class="card-lbl">廠商</span></div>
    <div class="card-bd">${vendorHtml()}</div>
  </div>

  <div class="card">
    <div class="card-hd"><span class="card-ico">🎚️</span><span class="card-lbl">混音機</span></div>
    <div class="card-bd">
      <div class="field"><label>混音器備註</label>
        <textarea id="mixerNote" placeholder="e.g. CH1 無線麥克風、CH3 客戶電腦音訊...">${esc(s.mixerNote)}</textarea>

  <div class="card">
    <div class="card-hd"><span class="card-ico">💡</span><span class="card-lbl">燈光設定</span></div>

      ${ltSceneListHtml()}
      <div class="draft-wrap">
        <div class="draft-lbl">新增燈光場景</div>
        ${r.hasStageLight?`
        <div class="field">
          <label>舞台燈光</label>

/* ── draft AV interactions ── */
function toggleDPt(el){
  const p=el.dataset.pt,d=AD();
  if(!d.pts)d.pts=[];
  if(el.classList.toggle('on')){if(!d.pts.includes(p))d.pts.push(p);}
  else{d.pts=d.pts.filter(x=>x!==p);if(d.pcMatrix)delete d.pcMatrix[p];}
  sav();refreshPtRows();
}
function toggleDMx(el){
  const pt=el.dataset.pt,n=parseInt(el.dataset.n),d=AD();
  if(!d.pcMatrix)d.pcMatrix={};
  if(!d.pcMatrix[pt])d.pcMatrix[pt]=[];
  const a=d.pcMatrix[pt],i=a.indexOf(n);
  if(i>=0){a.splice(i,1);el.classList.remove('on');}else{a.push(n);el.classList.add('on');}
  sav();
}
function setDTvMode(el){
  const v=el.dataset.v,d=AD(),was=el.classList.contains('on');
  document.querySelectorAll('.tv-chip').forEach(c=>c.classList.remove('on'));
  d.tvMode=was?'':v;if(!was)el.classList.add('on');sav();
}
function setDPurpose(el){
  const v=el.dataset.v,d=AD(),was=el.classList.contains('on');
  document.querySelectorAll('.pu-chip').forEach(c=>c.classList.remove('on'));
  d.tvPurpose=was?'':v;if(!was)el.classList.add('on');sav();
}
function toggleDGroup(el){
  const v=el.dataset.v,d=AD();
  if(!d.groups)d.groups=[];
  if(el.classList.toggle('on')){if(!d.groups.includes(v))d.groups.push(v);}
  else{d.groups=d.groups.filter(x=>x!==v);}
  sav();
}
function addAv(){
  saveFlds();const d=AD();
  if(!(d.pts||[]).length&&!d.tvMode){showToast('請至少選擇接點或電視牆模式',true);return;}
  avSc().push({pts:[...(d.pts||[])],pcMatrix:JSON.parse(JSON.stringify(d.pcMatrix||{})),
    tvMode:d.tvMode||'',groups:[...(d.groups||[])],tvPurpose:d.tvPurpose||'',tvCustom:(d.tvCustom||'').trim()});
  S().avDraft={};sav();render();
}
function delAv(i){avSc().splice(i,1);sav();render();}

/* ── draft lighting ── */
function setLtChip(el){
  const k=el.dataset.k,v=el.dataset.v,was=el.classList.contains('on');
  document.querySelectorAll(`.lt-chip[data-k="${k}"]`).forEach(c=>c.classList.remove('on'));
  LD()[k]=was?'':v;if(!was)el.classList.add('on');sav();
}
function addLt(){
  saveFlds();const ld=LD();
  if(!ld.stageLight&&!ld.roomLight){showToast('請至少選擇一項燈光設定',true);return;}
  ltSc().push({stageLight:ld.stageLight||'',roomLight:ld.roomLight||'',purpose:ld.ltPurpose||''});
  S().ltDraft={};sav();render();
}
function delLt(i){ltSc().splice(i,1);sav();render();}

/* ── general chips ── */
function toggleChip(el){
  const g=el.dataset.g,v=el.dataset.v;
  if(!S()[g])S()[g]=[];
  if(el.classList.toggle('on')){if(!S()[g].includes(v))S()[g].push(v);}
  else{S()[g]=S()[g].filter(x=>x!==v);}
  sav();
}
function setSingle(el){
  const k=el.dataset.k,v=el.dataset.v,was=el.classList.contains('on');
  document.querySelectorAll(`.single-chip[data-k="${k}"]`).forEach(c=>c.classList.remove('on'));
  S()[k]=was?'':v;if(!was)el.classList.add('on');sav();
}

/* ── toggles ── */
function togs(key,yL,nL){
  const v=S()[key]||'';
  const base='padding:9px;border:1px solid;border-radius:var(--rs);font-size:13px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s;user-select:none;';
  return`<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
    <div style="${base}background:${v==='是'?'var(--ok-bg)':'var(--sf2)'};border-color:${v==='是'?'var(--ok-bd)':'var(--bd2)'};color:${v==='是'?'var(--ok)':'var(--tx2)'}" data-k="${key}" data-v="是" onclick="doTog(this)">${yL}</div>
    <div style="${base}background:${v==='否'?'var(--no-bg)':'var(--sf2)'};border-color:${v==='否'?'var(--no-bd)':'var(--bd2)'};color:${v==='否'?'var(--no)':'var(--tx2)'}" data-k="${key}" data-v="否" onclick="doTog(this)">${nL}</div>
  </div>`;
}
function doTog(el){
  const k=el.dataset.k,v=el.dataset.v;S()[k]=v;sav();
  if(k==='hasBGM'){const r=document.getElementById('bgm-row');if(r)r.style.display=v==='是'?'':'none';}
  else render();
}

function setVendor(el){
  S().vendor=el.dataset.v;sav();
  document.querySelectorAll('.vendor-opt').forEach(o=>{
    const cfg=VENDOR_OPTS.find(x=>x.k===o.dataset.v);
    o.className='vendor-opt'+(S().vendor===o.dataset.v?' '+cfg.cls:'');
  });
}
function setArrive(val,el){
  document.querySelectorAll('.aopt').forEach(a=>a.classList.remove('on'));
  el.classList.add('on');S().arrive=val;sav();
}
function sw(room,el){
  saveFlds();cur=room;
  document.querySelectorAll('.rtab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');render();
}
function saveFlds(){
  document.querySelectorAll('#form input[id],#form select[id],#form textarea[id]').forEach(el=>{
    if(el.id==='tvCustom')AD().tvCustom=el.value;
    else S()[el.id]=el.value;
  });
  sav();
}

/* ── shared content builder ── */
function buildContent(){
  saveFlds();const s=S();
  const ts=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  const vendorLabel={none:'無廠商',audio:'有廠商・自帶音響',sys:'有廠商・接系統'}[s.vendor||'']||'─';
  const sep='━━━━━━━';
  const subSep='──────';

  const rows=[
`【${RM[cur].label} 中控交接清單】`,
sep,
`📋 活動：${gv('eventName')}`,
`📅 日期：${gv('eventDate')}`,
`⏰ 到場時間：${s.arrive||'─'}`,
`👔 負責業務：${(s.bizOwner||[]).join('、')||'─'}`,
``,`🎬 接點 / 電視牆場景`,
  ];
  const asc=avSc();
  if(asc.length){
    asc.forEach((sc,i)=>{
      rows.push(`  ┌ 場景${i+1}`);
      (sc.pts||[]).forEach(pt=>{
        const sel=((sc.pcMatrix||{})[pt]||[]).sort((a,b)=>a-b).map(n=>{
          const m=RM[cur].mx.find(x=>x.n===n);return`IN${n}${m&&!m.l.startsWith('IN')?'·'+m.l:''}`;
        });
        rows.push(`  │ ${pt} → ${sel.length?sel.join(', '):'─'}`);
      });
      const tv=[sc.tvMode,sc.tvPurpose,(sc.tvCustom||'').trim()].filter(Boolean).join(' · ');
      if(tv)rows.push(`  │ 📺 ${tv}`);
      if((sc.groups||[]).length)rows.push(`  │ 套用：${sc.groups.join('、')}`);
      rows.push(`  └${subSep}`);
    });
  }else rows.push('  尚未設定場景');

  rows.push(``,`🏭 廠商：${vendorLabel}`);
  rows.push(``,`🎚️ 混音機`);
  if((s.mixerNote||'').trim())rows.push(`└ 混音備註：${s.mixerNote.trim()}`);
  else rows.push('└ 無備註');

  rows.push(``,`💡 燈光設定`);
  const lsc=ltSc();
  if(lsc.length){
    lsc.forEach((sc,i)=>{
      rows.push(`  ┌ 燈光${i+1}${sc.purpose?' 【'+sc.purpose+'】':''}`);
      if(RM[cur].hasStageLight&&sc.stageLight)rows.push(`  │ 舞台：${sc.stageLight}`);
      if(sc.roomLight)rows.push(`  │ 場燈：${sc.roomLight}`);
      rows.push(`  └${subSep}`);
    });
  }else rows.push('  尚未設定燈光場景');

  const relayRooms=[...(s.relayRooms||[])];
  if(s.relayCustom1On&&(s.relayCustom1||'').trim())relayRooms.push(s.relayCustom1.trim());
  if(s.relayCustom2On&&(s.relayCustom2||'').trim())relayRooms.push(s.relayCustom2.trim());
  if(s.relayIn||s.relayOut||relayRooms.length){
    rows.push(``,`🔁 串場需求`);
    rows.push(`└ HDMI：${relayInText(s.relayIn)} → ${relayOutText(s.relayOut)}`);
    rows.push(`└ 會議室：${relayRooms.join('、')||'─'}`);
  }

  if((s.notes||'').trim())rows.push(``,`📝 備註：${s.notes.trim()}`);
  rows.push(``,`🧪 測試資訊`);
  rows.push(`└ 測試日期：${gv('testDate')}`);
  rows.push(`└ 測試人員：${(s.testPerson||[]).join('、')||'─'}`);
  rows.push(`⏱ 填表：${ts}`);
  rows.push(sep);
  return rows.join('\n');
}

/* ── LINE copy ── */
function gv(id){return(S()[id]||'').trim()||'─'}
function copyLine(){
  const txt=buildContent();
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('✅ 已複製！直接貼到 LINE')};
  if(navigator.clipboard?.writeText){navigator.clipboard.writeText(txt).then(()=>showToast('✅ 已複製！直接貼到 LINE')).catch(fb)}else fb();
}
function sendEmail(){
  saveFlds();const s=S();
  const subject=`【${RM[cur].label} 中控交接清單】${gv('eventDate')} ${gv('eventName')}`;
  const body=buildContent();
  // copy body to clipboard
  const doCopy=()=>{
    const ta=document.createElement('textarea');ta.value=body;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
  };
  if(navigator.clipboard?.writeText){navigator.clipboard.writeText(body).catch(doCopy);}else doCopy();
  // open email client
  const mailto=`mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.open(mailto,'_blank');
  showToast('📧 已開啟郵件，內容也已複製');
}

function showToast(msg,err){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast'+(err?' err':'')+' show';
  setTimeout(()=>t.classList.remove('show'),2600);
}
function clearForm(){
  if(!confirm(`清除 ${RM[cur].label} 所有資料？`))return;
  st[cur]={avScenes:[],avDraft:{},ltScenes:[],ltDraft:{}};sav();render();
}
document.addEventListener('input',e=>{
  if(!e.target.id)return;
  if(e.target.id==='tvCustom')AD().tvCustom=e.target.value;
  else S()[e.target.id]=e.target.value;
  sav();
});
render();
</script>
