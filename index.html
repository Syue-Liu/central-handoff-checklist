<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>中控交接清單 — 張榮發基金會</title>
<style>
:root{
  --bg:#f0efe9;--sf:#fff;--sf2:#f6f5f2;
  --ac:#1a73e8;--ac-bg:#e8f0fe;--ac-bd:#a8c7fa;--ac-tx:#1557b0;
  --ok:#1a7a50;--ok-bg:#e6f4ee;--ok-bd:#86c9a8;
  --no:#b03020;--no-bg:#fde8e6;--no-bd:#f5a8a4;
  --wa:#7a4a00;--wa-bg:#fff3e0;--wa-bd:#ffcc80;
  --pu:#5b21b6;--pu-bg:#ede9fe;--pu-bd:#c4b5fd;
  --tx:#1c1c1e;--tx2:#6e6e73;--tx3:#b0afab;
  --bd:#e0ddd6;--bd2:#c8c4bc;
  --r:12px;--rs:8px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1e;--sf:#2c2c2e;--sf2:#3a3a3c;
  --tx:#f2f2f7;--tx2:#aeaeb2;--tx3:#6e6e73;
  --bd:#3a3a3c;--bd2:#5a5a5e;
  --ac-bg:#1c3055;--ac-bd:#3b6bb5;--ac-tx:#82b4f5;
  --ok-bg:#0f3324;--ok-bd:#2d6b4a;
  --no-bg:#3a1a18;--no-bd:#7a3a36;
  --wa-bg:#3a2800;--wa-bd:#9a6e00;--wa:#e8a020;
  --pu-bg:#2d1b69;--pu-bd:#7c3aed;--pu:#a78bfa;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,'Helvetica Neue','Noto Sans TC',sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}

.hdr{background:var(--sf);border-bottom:1px solid var(--bd);padding:13px 18px;position:sticky;top:0;z-index:100}
.hdr-title{font-size:17px;font-weight:600;display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:#34c759;flex-shrink:0}
.hdr-sub{font-size:12px;color:var(--tx2);margin-top:3px}

.rnav{background:var(--sf);border-bottom:1px solid var(--bd);display:flex;padding:0 18px}
.rtab{flex-shrink:0;padding:11px 14px;border:none;background:transparent;color:var(--tx2);font-size:14px;font-weight:500;cursor:pointer;border-bottom:2.5px solid transparent;transition:all .15s;font-family:inherit}
.rtab.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:600}

.main{padding:14px 18px 40px;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:11px}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.card-hd{padding:10px 15px;border-bottom:1px solid var(--bd);background:var(--sf2);display:flex;align-items:center;gap:7px}
.card-ico{font-size:14px;line-height:1}
.card-lbl{font-size:11px;font-weight:600;color:var(--tx2);letter-spacing:.5px;text-transform:uppercase}
.card-bd{padding:15px;display:flex;flex-direction:column;gap:12px}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--tx2);font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--bd2);border-radius:var(--rs);background:var(--sf2);color:var(--tx);font-size:14px;font-family:inherit;-webkit-appearance:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(26,115,232,.1)}
.field textarea{resize:vertical;min-height:72px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* arrival */
.aopts{display:flex;gap:6px}
.aopt{flex:1;padding:9px 4px;border:1px solid var(--bd2);border-radius:var(--rs);background:var(--sf2);color:var(--tx2);text-align:center;cursor:pointer;transition:all .15s;user-select:none}
.aopt-t{font-size:15px;font-weight:600;display:block}
.aopt-s{font-size:11px;opacity:.7;display:block;margin-top:1px}
.aopt.on{background:var(--wa-bg);border-color:var(--wa-bd);color:var(--wa);font-weight:600}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{padding:6px 12px;border:1px solid var(--bd2);border-radius:20px;font-size:13px;color:var(--tx2);cursor:pointer;background:var(--sf2);transition:all .15s;user-select:none}
.chip.on{background:var(--ac-bg);border-color:var(--ac-bd);color:var(--ac-tx);font-weight:500}

/* TV wall */
.tv-modes{display:flex;flex-wrap:wrap;gap:6px}
.tv-chip{padding:7px 12px;border:1px solid var(--bd2);border-radius:var(--rs);font-size:13px;font-weight:500;color:var(--tx2);cursor:pointer;background:var(--sf2);transition:all .15s;user-select:none}
.tv-chip.on{background:var(--ac-bg);border-color:var(--ac-bd);color:var(--ac-tx)}
.pu-chips{display:flex;flex-wrap:wrap;gap:6px}
.pu-chip{padding:5px 12px;border:1px solid var(--bd2);border-radius:20px;font-size:12px;color:var(--tx2);cursor:pointer;background:var(--sf2);transition:all .15s;user-select:none}
.pu-chip.on{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok);font-weight:500}
.tv-custom{display:flex;align-items:center;gap:7px;margin-top:6px}
.tv-custom span{font-size:12px;color:var(--tx2);white-space:nowrap}

/* ─── WATERFALL signal builder ─── */
.wf-wrap{display:flex;flex-direction:column;gap:0;border:1px solid var(--bd2);border-radius:var(--rs);overflow:hidden}

.wf-step{display:flex;flex-direction:column;gap:8px;padding:12px;border-bottom:1px solid var(--bd);transition:opacity .2s}
.wf-step:last-child{border-bottom:none}
.wf-step.dim{opacity:.35;pointer-events:none}

.wf-hd{display:flex;align-items:center;gap:7px}
.wf-badge{width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.wf-badge.done{background:var(--ok);color:#fff}
.wf-badge.active{background:var(--ac);color:#fff}
.wf-badge.idle{background:var(--bd2);color:var(--tx3)}
.wf-title{font-size:12px;font-weight:600;color:var(--tx2)}
.wf-val{font-size:12px;font-weight:600;color:var(--ok);margin-left:auto}

.wf-chips{display:flex;flex-wrap:wrap;gap:5px}
.wf-chip{padding:6px 10px;border:1px solid var(--bd2);border-radius:var(--rs);font-size:12px;font-weight:500;color:var(--tx2);cursor:pointer;background:var(--sf2);transition:all .12s;user-select:none;text-align:center}
.wf-chip.on-pt{background:var(--wa-bg);border-color:var(--wa-bd);color:var(--wa)}
.wf-chip.on-in{background:var(--ac-bg);border-color:var(--ac-bd);color:var(--ac-tx)}
.wf-chip.on-out{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
.wf-chip .wc-n{display:block;font-weight:700;font-size:11px;line-height:1.3}
.wf-chip .wc-l{display:block;font-size:10px;opacity:.7;line-height:1.2}

.wf-confirm{display:flex;justify-content:flex-end;padding-top:4px}
.btn-wf-confirm{padding:8px 16px;border:none;border-radius:var(--rs);background:var(--ok);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn-wf-confirm:disabled{opacity:.35;cursor:not-allowed}

/* pending signal lines */
.pending-lines{display:flex;flex-direction:column;gap:5px}
.pending-line{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:8px 11px;display:flex;align-items:center;gap:6px;font-size:12px;flex-wrap:wrap}
.pl-pt{color:var(--wa);font-weight:600}
.pl-in{color:var(--ac-tx);font-weight:600}
.pl-out{color:var(--ok);font-weight:600}
.arr{color:var(--tx3);font-size:11px;flex-shrink:0}
.pl-del{border:none;background:transparent;color:var(--tx3);font-size:15px;cursor:pointer;padding:0;line-height:1;margin-left:auto;flex-shrink:0}
.pl-del:hover{color:var(--no)}

/* confirmed scene cards */
.scene-list{display:flex;flex-direction:column;gap:7px}
.scene-item{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);padding:10px 12px;display:flex;align-items:flex-start;gap:8px}
.scene-num{width:22px;height:22px;border-radius:50%;background:var(--ac-bg);border:1px solid var(--ac-bd);color:var(--ac-tx);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.lt-num{background:var(--wa-bg) !important;border-color:var(--wa-bd) !important;color:var(--wa) !important}
.scene-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.scene-badges{display:flex;flex-wrap:wrap;gap:4px}
.badge{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.badge-tv{background:var(--ac-bg);border:1px solid var(--ac-bd);color:var(--ac-tx)}
.badge-pu{background:var(--ok-bg);border:1px solid var(--ok-bd);color:var(--ok)}
.badge-cu{background:var(--sf2);border:1px solid var(--bd2);color:var(--tx2)}
.scene-sig{font-size:12px;color:var(--tx);line-height:1.6}
.s-pt{color:var(--wa);font-weight:600}
.s-in{color:var(--ac-tx);font-weight:600}
.s-out{color:var(--ok);font-weight:600}
.s-arr{color:var(--tx3);font-size:10px;margin:0 2px}
.scene-del{border:none;background:transparent;color:var(--tx3);font-size:16px;cursor:pointer;padding:0 2px;line-height:1;flex-shrink:0}
.scene-del:hover{color:var(--no)}
.draft-sep{height:1px;background:var(--bd);margin:2px 0}
.draft-lbl{font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:.4px;text-transform:uppercase}

/* lighting */
.lt-chips{display:flex;flex-wrap:wrap;gap:6px}
.lt-chip{padding:6px 11px;border:1px solid var(--bd2);border-radius:var(--rs);font-size:13px;font-weight:500;color:var(--tx2);cursor:pointer;background:var(--sf2);transition:all .15s;user-select:none}
.lt-chip.on{background:var(--wa-bg);border-color:var(--wa-bd);color:var(--wa)}

/* vendor */
.vendor-opts{display:flex;flex-direction:column;gap:6px}
.vendor-opt{padding:11px 14px;border:1px solid var(--bd2);border-radius:var(--rs);background:var(--sf2);color:var(--tx2);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;user-select:none;display:flex;align-items:center;gap:10px}
.vo-dot{width:8px;height:8px;border-radius:50%;background:var(--bd2);flex-shrink:0}
.vendor-opt.v-none{border-color:var(--tx3)}.vendor-opt.v-none .vo-dot{background:var(--tx3)}
.vendor-opt.v-audio{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}.vendor-opt.v-audio .vo-dot{background:var(--ok)}
.vendor-opt.v-sys{background:var(--ac-bg);border-color:var(--ac-bd);color:var(--ac-tx)}.vendor-opt.v-sys .vo-dot{background:var(--ac)}

/* add / action buttons */
.btn-add{width:100%;padding:11px;border:1.5px dashed var(--ac-bd);border-radius:var(--rs);background:var(--ac-bg);color:var(--ac-tx);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-add-lt{border-color:var(--wa-bd) !important;background:var(--wa-bg) !important;color:var(--wa) !important}
.btn-add:active{opacity:.8}

.actions{display:flex;flex-direction:column;gap:7px;padding-bottom:16px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-copy{width:100%;padding:14px;border:none;border-radius:var(--r);background:var(--ac);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn-copy:active{opacity:.82}
.btn-email{background:var(--ok) !important}
.btn-clr{width:100%;padding:9px;border:1px solid var(--bd2);border-radius:var(--rs);background:transparent;color:var(--tx2);font-size:13px;cursor:pointer;font-family:inherit}

/* test card */
.test-card .card-hd{background:var(--pu-bg);border-color:var(--pu-bd)}
.test-card .card-lbl{color:var(--pu)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:#1a7a50;color:#fff;padding:11px 22px;border-radius:22px;font-size:14px;font-weight:500;transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap;z-index:999}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:#b03020}

@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.wf-step{animation:slideIn .18s ease}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="hdr">
  <div class="hdr-title"><span class="dot"></span>中控交接清單</div>
  <div class="hdr-sub">張榮發基金會 · 影音設備交接</div>
</div>

<div class="rnav">
  <button class="rtab on" onclick="sw('1101',this)">1101廳</button>
  <button class="rtab" onclick="sw('1001',this)">1001廳</button>
  <button class="rtab" onclick="sw('801',this)">801廳</button>
</div>

<div class="main" id="form"></div>

<script>
const RM={
  '1101':{label:'1101廳',hasStageLight:true,
    pts:['左側舞台','中側舞台','右側舞台','電視牆後方','後方分配盤','中控室'],
    mxIn:[{n:1,l:'舞台右'},{n:2,l:'電視牆後1'},{n:3,l:'電視牆後2'},{n:4,l:'電視牆後3'},
          {n:5,l:'外接1'},{n:6,l:'外接2'},{n:7,l:'16x16 OUT-1'},{n:8,l:'中控'}],
    mxOut:[{n:1,l:'電視牆1'},{n:2,l:'電視牆2'},{n:3,l:'電視牆3'},{n:4,l:'電視牆4'},
           {n:5,l:'16x16 IN-1'},{n:6,l:'16x16 IN-2'},{n:7,l:'16x16 IN-3'},{n:8,l:'16x16 IN-4'}],
    tvModes:['全屏','2畫面','3畫面(黑)','3畫面','全:1:全','1:全:1','自訂1','自訂2','自訂3','展示']},
  '1001':{label:'1001廳',hasStageLight:false,
    pts:['左側舞台','右側舞台','第一排座位','後方分配盤'],
    mxIn:[{n:1,l:'講台右'},{n:2,l:'講台右2'},{n:3,l:'座位區'},{n:4,l:'外接1'},
          {n:5,l:'外接2'},{n:6,l:'外接3'},{n:7,l:'16x16 Out1'},{n:8,l:'中控'}],
    mxOut:[{n:1,l:'電視牆1'},{n:2,l:'電視牆2'},{n:3,l:'電視牆3'},{n:4,l:'電視牆4'},
           {n:5,l:'16x16 IN-1'},{n:6,l:'16x16 IN-2'},{n:7,l:'16x16 IN-3'},{n:8,l:'16x16 IN-4'}],
    tvModes:['全屏','3畫面(黑)','4畫面(黑)','1:2:1','1:全版:1','3畫面(底)','4畫面','自訂1','自訂2','展示']},
  '801':{label:'801廳',hasStageLight:false,
    pts:['左側舞台','右側舞台','第一排座位','後方分配盤'],
    mxIn:[{n:1,l:'講台右'},{n:2,l:'講台右2'},{n:3,l:'座位區'},{n:4,l:'外接1'},
          {n:5,l:'外接2'},{n:6,l:'外接3'},{n:7,l:'16x16 Out1'},{n:8,l:'中控'}],
    mxOut:[{n:1,l:'電視牆1'},{n:2,l:'電視牆2'},{n:3,l:'電視牆3'},{n:4,l:'電視牆4'},
           {n:5,l:'16x16 IN-1'},{n:6,l:'16x16 IN-2'},{n:7,l:'16x16 IN-3'},{n:8,l:'16x16 IN-4'}],
    tvModes:['全屏','3畫面(黑)','4畫面(黑)','1:2:1','1:全版:1','3畫面(底)','4畫面','自訂1','自訂2','展示']}
};

const ARRIVE=[['07:30','提早'],['08:15','提早'],['08:30','正常']];
const TV_PURPOSES=['簡報','開場','主視覺'];
const GROUPS=[1,2,3,4,5,6];
const BGM_SRC=['客戶電腦','中控電腦','廠商設備','串流平台','其他'];
const STAGE_SCENES=['全亮','場景一','場景二','場景三','場景四','場景五','場景六','場景七','場景八','全暗'];
const ROOM_SCENES=['全亮','場景一','場景二','場景三','場景四','場景五','場景六','全暗'];
const VENDOR_OPTS=[
  {k:'none', cls:'v-none',  label:'無廠商'},
  {k:'audio',cls:'v-audio', label:'有廠商・自帶音響'},
  {k:'sys',  cls:'v-sys',   label:'有廠商・接系統'}
];
const TEST_PERSONS=['彥宇','偉偉','佳學','77'];
const BIZ_OWNERS=['沙課','武勇','定洲','vickey','joy','冠輝','三和','瑋平','忠謙'];

const LS='av_v10';
let cur='1101';
let st=lod();
let editingIdx=-1; // -1 = new scene, >=0 = editing scene at that index

function lod(){try{const d=localStorage.getItem(LS);return d?JSON.parse(d):mk()}catch{return mk()}}
function mk(){return{
  '1101':{avScenes:[],avDraft:{sigs:[],sd:{}},ltScenes:[],ltDraft:{}},
  '1001':{avScenes:[],avDraft:{sigs:[],sd:{}},ltScenes:[],ltDraft:{}},
  '801': {avScenes:[],avDraft:{sigs:[],sd:{}},ltScenes:[],ltDraft:{}}
}}
function sav(){try{localStorage.setItem(LS,JSON.stringify(st))}catch{}}
function today(){return new Date().toISOString().split('T')[0]}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}

function S(){return st[cur]}
function AD(){if(!S().avDraft)S().avDraft={sigs:[],sd:{}};return S().avDraft}
function LD(){if(!S().ltDraft)S().ltDraft={};return S().ltDraft}
function SD(){if(!AD().sd)AD().sd={};return AD().sd}
function avSc(){if(!S().avScenes)S().avScenes=[];return S().avScenes}
function ltSc(){if(!S().ltScenes)S().ltScenes=[];return S().ltScenes}
function pSigs(){if(!AD().sigs)AD().sigs=[];return AD().sigs}

/* label helpers */
function inLbl(n){const m=RM[cur].mxIn.find(x=>x.n===n);return m?`IN${n}·${m.l}`:`IN${n}`}
function outLbl(ns){if(!Array.isArray(ns))ns=[ns];return ns.sort((a,b)=>a-b).map(n=>{const m=RM[cur].mxOut.find(x=>x.n===n);return`OUT${n}·${m?m.l:n}`;}).join(', ')}

/* ── waterfall HTML ── */
function wfHtml(){
  const sd=SD(),d=AD(),r=RM[cur];
  const hasPt=!!sd.pt, hasIn=sd.inN!=null, hasOut=(sd.outNs||[]).length>0;

  const badgeClass=(step)=>{
    if(step===1)return hasPt?'done':'active';
    if(step===2)return hasIn?'done':hasPt?'active':'idle';
    if(step===3)return hasOut?'done':hasIn?'active':'idle';
  };

  return`<div class="wf-wrap">

    <!-- Step 1: 接點 -->
    <div class="wf-step">
      <div class="wf-hd">
        <div class="wf-badge ${badgeClass(1)}">${hasPt?'✓':'1'}</div>
        <div class="wf-title">接點位置</div>
        ${hasPt?`<div class="wf-val">${sd.pt}</div>`:''}
      </div>
      <div class="wf-chips">
        ${[...r.pts,'其他'].map(p=>`
          <div class="wf-chip${sd.pt===p?' on-pt':''}" onclick="wfSetPt('${p}')">${p}</div>`).join('')}
      </div>
    </div>

    <!-- Step 2: IN -->
    <div class="wf-step${hasPt?'':' dim'}">
      <div class="wf-hd">
        <div class="wf-badge ${badgeClass(2)}">${hasIn?'✓':'2'}</div>
        <div class="wf-title">8×8 矩陣 IN</div>
        ${hasIn?`<div class="wf-val">${inLbl(sd.inN)}</div>`:''}
      </div>
      <div class="wf-chips">
        ${r.mxIn.map(({n,l})=>`
          <div class="wf-chip${sd.inN===n?' on-in':''}" onclick="wfSetIn(${n})">
            <span class="wc-n">IN${n}</span><span class="wc-l">${l}</span>
          </div>`).join('')}
      </div>
    </div>

    <!-- Step 3: OUT multi-select -->
    <div class="wf-step${hasIn?'':' dim'}">
      <div class="wf-hd">
        <div class="wf-badge ${badgeClass(3)}">${hasOut?'✓':'3'}</div>
        <div class="wf-title">8×8 矩陣 OUT <span style="font-weight:400;opacity:.7">（可複選）</span></div>
      </div>
      <div class="wf-chips">
        ${r.mxOut.map(({n,l})=>`
          <div class="wf-chip${(sd.outNs||[]).includes(n)?' on-out':''}" onclick="wfToggleOut(${n})">
            <span class="wc-n">OUT${n}</span><span class="wc-l">${l}</span>
          </div>`).join('')}
      </div>
      <div class="wf-confirm">

}

/* waterfall interactions — no full re-render, just update DOM */
function wfSetPt(p){
  const sd=SD(),was=sd.pt===p;
  sd.pt=was?'':p;
  // reset downstream
  if(was||!sd.pt){sd.inN=null;sd.outNs=[];}
  sav();refreshWf();
}
function wfSetIn(n){
  const sd=SD(),was=sd.inN===n;
  sd.inN=was?null:n;
  if(was)sd.outNs=[];
  sav();refreshWf();
}
function wfToggleOut(n){
  const sd=SD();
  if(!sd.outNs)sd.outNs=[];
  const i=sd.outNs.indexOf(n);
  if(i>=0)sd.outNs.splice(i,1);else sd.outNs.push(n);
  sav();refreshWf();
}
function wfConfirmLine(){
  const sd=SD();
  if(!sd.pt||sd.inN==null||!(sd.outNs||[]).length)return;
  pSigs().push({pt:sd.pt,inN:sd.inN,outNs:[...sd.outNs]});
  AD().sd={};// reset draft
  sav();
  // update pending list + waterfall without full re-render
  refreshPendingLines();
  refreshWf();
  // scroll waterfall into view
  document.getElementById('wf-container')?.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function refreshWf(){
  const el=document.getElementById('wf-container');
  if(el)el.innerHTML=wfHtml();
}
function refreshPendingLines(){
  const el=document.getElementById('pending-container');
  if(el)el.innerHTML=pendingLinesHtml();
}

function pendingLinesHtml(){
  const sigs=pSigs();
  if(!sigs.length)return'';
  return sigs.map((sig,i)=>`
    <div class="pending-line">
      <span class="pl-pt">${sig.pt}</span>
      <span class="arr">→</span>
      <span class="pl-in">${inLbl(sig.inN)}</span>
      <span class="arr">→</span>
      <span class="pl-out">${outLbl(sig.outNs)}</span>
      <button class="pl-del" onclick="delPending(${i})">✕</button>
    </div>`).join('');
}
function delPending(i){pSigs().splice(i,1);sav();refreshPendingLines();}

/* ── scene card HTML ── */
function avSceneHtml(sc,i){
  const tvMode=sc.tvMode||'',purpose=sc.tvPurpose||'',custom=(sc.tvCustom||'').trim();
  const sigs=(sc.signals||[]).map(sig=>`<div class="scene-sig">
    <span class="s-pt">${sig.pt}</span><span class="s-arr">→</span>
    <span class="s-in">${inLbl(sig.inN)}</span><span class="s-arr">→</span>
    <span class="s-out">${outLbl(sig.outNs||[sig.outN])}</span>
  </div>`).join('');
  return`<div class="scene-item">
    <div class="scene-num">${i+1}</div>
    <div class="scene-body">
      <div class="scene-badges">
        ${tvMode?`<span class="badge badge-tv">📺 ${tvMode}</span>`:''}
        ${purpose?`<span class="badge badge-pu">${purpose}</span>`:''}
        ${custom?`<span class="badge badge-cu">${custom}</span>`:''}

        ${!tvMode&&!purpose?`<span style="font-size:11px;color:var(--tx3)">未設定電視牆</span>`:''}
      </div>
      ${sigs||'<div style="font-size:12px;color:var(--tx3);margin-top:2px">未設定訊號路徑</div>'}
    </div>
    <button class="scene-del" onclick="editAv(${i})" style="color:var(--ac-tx);font-size:14px;margin-right:2px" title="編輯">✎</button>
    <button class="scene-del" onclick="delAv(${i})">✕</button>

function ltSceneHtml(sc,i){
  const parts=[];
  if(sc.purpose)parts.push(`【${sc.purpose}】`);

    <div class="scene-num lt-num">${i+1}</div>
    <div class="scene-body">
      <div style="font-size:13px;font-weight:500">${parts.join('　')||'─'}</div>
    </div>
    <button class="scene-del" onclick="delLt(${i})">✕</button>
  </div>`;
}

/* ── scene add / edit / delete ── */
function addAv(){
  saveFlds();const d=AD();
  if(!pSigs().length&&!d.tvMode){showToast('請至少設定電視牆模式或一條訊號路徑',true);return;}
  const sc={signals:[...pSigs()],tvMode:d.tvMode||'',tvPurpose:d.tvPurpose||'',
            tvCustom:(d.tvCustom||'').trim(),group:d.group||null};
  if(editingIdx>=0){avSc()[editingIdx]=sc;editingIdx=-1;}
  else{avSc().push(sc);}
  S().avDraft={sigs:[],sd:{}};sav();render();
}
function editAv(i){
  const sc=avSc()[i];
  S().avDraft={sigs:[...(sc.signals||[])],sd:{},
    tvMode:sc.tvMode||'',tvPurpose:sc.tvPurpose||'',
    tvCustom:sc.tvCustom||'',group:sc.group||null};
  editingIdx=i;sav();render();
  document.querySelector('.draft-lbl')?.scrollIntoView({behavior:'smooth',block:'start'});
}
function cancelEdit(){editingIdx=-1;S().avDraft={sigs:[],sd:{}};sav();render();}
function delAv(i){if(editingIdx===i)editingIdx=-1;avSc().splice(i,1);sav();render();}

function setLtChip(el){
  const k=el.dataset.k,v=el.dataset.v,was=el.classList.contains('on');
  document.querySelectorAll(`[data-k="${k}"]`).forEach(c=>c.classList.remove('on'));
  LD()[k]=was?'':v;if(!was)el.classList.add('on');sav();
}
function addLt(){
  saveFlds();const ld=LD();
  if(!ld.stageLight&&!ld.roomLight){showToast('請至少選擇一項燈光設定',true);return;}
  ltSc().push({stageLight:ld.stageLight||'',roomLight:ld.roomLight||'',purpose:ld.ltPurpose||''});
  S().ltDraft={};sav();render();
}
function delLt(i){ltSc().splice(i,1);sav();render();}

/* ── TV mode / purpose (update without re-render) ── */
function setDGroup(v){
  AD().group=AD().group===v?null:v;sav();refreshWf();
}
function setDTvMode(el){
  const v=el.dataset.v,was=el.classList.contains('on');
  document.querySelectorAll('.tv-chip').forEach(c=>c.classList.remove('on'));
  AD().tvMode=was?'':v;if(!was)el.classList.add('on');sav();
}
function setDPurpose(el){
  const v=el.dataset.v,was=el.classList.contains('on');
  document.querySelectorAll('.pu-chip:not([data-k])').forEach(c=>c.classList.remove('on'));
  AD().tvPurpose=was?'':v;if(!was)el.classList.add('on');sav();
}

/* ── general chip / toggles ── */
function toggleChip(el){
  const g=el.dataset.g,v=el.dataset.v;
  if(!S()[g])S()[g]=[];
  if(el.classList.toggle('on')){if(!S()[g].includes(v))S()[g].push(v);}
  else{S()[g]=S()[g].filter(x=>x!==v);}
  sav();
}
function togs(key,yL,nL){
  const v=S()[key]||'';
  const b='padding:9px;border:1px solid;border-radius:var(--rs);font-size:13px;font-weight:500;cursor:pointer;text-align:center;user-select:none;';
  return`<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
    <div style="${b}background:${v==='是'?'var(--ok-bg)':'var(--sf2)'};border-color:${v==='是'?'var(--ok-bd)':'var(--bd2)'};color:${v==='是'?'var(--ok)':'var(--tx2)'}" data-k="${key}" data-v="是" onclick="doTog(this)">${yL}</div>
    <div style="${b}background:${v==='否'?'var(--no-bg)':'var(--sf2)'};border-color:${v==='否'?'var(--no-bd)':'var(--bd2)'};color:${v==='否'?'var(--no)':'var(--tx2)'}" data-k="${key}" data-v="否" onclick="doTog(this)">${nL}</div>
  </div>`;
}
function doTog(el){
  const k=el.dataset.k,v=el.dataset.v;S()[k]=v;sav();
  if(k==='hasBGM'){const r=document.getElementById('bgm-row');if(r)r.style.display=v==='是'?'':'none';}

function setVendor(el){

function setArrive(val,el){

function sw(room,el){

function saveFlds(){
  document.querySelectorAll('#form input[id],#form select[id],#form textarea[id]').forEach(el=>{
    if(el.id==='tvCustom')AD().tvCustom=el.value;
    else S()[el.id]=el.value;

/* ── content / copy / email ── */
function gv(id){return(S()[id]||'').trim()||'─'}
function buildContent(){
  saveFlds();const s=S();
  const ts=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  const bgmSrcs=s.bgmSrc||[];
  const vendorLabel={none:'無廠商',audio:'有廠商・自帶音響',sys:'有廠商・接系統'}[s.vendor||'']||'─';
  const rows=[
`【${RM[cur].label} 中控交接清單】`,
`━━━━━━━━━━━━━━━━━`,
`📋 活動：${gv('eventName')}`,
`📅 日期：${gv('eventDate')}`,
`⏰ 到場時間：${s.arrive||'─'}`,
`👔 負責業務：${(s.bizOwner||[]).join('、')||'─'}`,
``,`🎬 接點 / 電視牆場景`,
  ];
  const asc=avSc();
  if(asc.length){
    asc.forEach((sc,i)=>{
      const tv=[sc.tvMode,sc.tvPurpose,(sc.tvCustom||'').trim()].filter(Boolean).join(' · ');
      const grp=sc.group?` ／ 群組${sc.group}`:'';
      rows.push(`  ┌ 場景${i+1}${tv?' 【'+tv+'】':''}${grp}`);
      (sc.signals||[]).forEach(sig=>{
        rows.push(`  │ ${sig.pt} → ${inLbl(sig.inN)} → ${outLbl(sig.outNs||[sig.outN])}`);
      });
      rows.push(`  └${'─'.repeat(16)}`);
    });
  }else rows.push('  尚未設定場景');
  rows.push(``,`🏭 廠商：${vendorLabel}`);
  rows.push(``,`🎚️ 混音機 / 音源`);
  rows.push(`└ BGM：${s.hasBGM||'─'}${s.hasBGM==='是'&&bgmSrcs.length?' ('+bgmSrcs.join('、')+')':''}`);
  if((s.mixerNote||'').trim())rows.push(`└ 混音備註：${s.mixerNote.trim()}`);
  rows.push(``,`💡 燈光設定`);
  const lsc=ltSc();
  if(lsc.length){
    lsc.forEach((sc,i)=>{
      rows.push(`  ┌ 燈光${i+1}${sc.purpose?' 【'+sc.purpose+'】':''}`);
      if(RM[cur].hasStageLight&&sc.stageLight)rows.push(`  │ 舞台：${sc.stageLight}`);
      if(sc.roomLight)rows.push(`  │ 場燈：${sc.roomLight}`);
      rows.push(`  └${'─'.repeat(16)}`);
    });
  }else rows.push('  尚未設定燈光場景');
  if((s.notes||'').trim())rows.push(``,`📝 備註：${s.notes.trim()}`);
  rows.push(``,`🧪 測試資訊`);
  rows.push(`└ 測試日期：${gv('testDate')}`);
  rows.push(`└ 測試人員：${(s.testPerson||[]).join('、')||'─'}`);
  rows.push(`⏱ 填表：${ts}`,`━━━━━━━━━━━━━━━━━`);
  return rows.join('\n');
}
function copyLine(){
  const txt=buildContent();
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('✅ 已複製！直接貼到 LINE')};
  if(navigator.clipboard?.writeText){navigator.clipboard.writeText(txt).then(()=>showToast('✅ 已複製！直接貼到 LINE')).catch(fb)}else fb();
}
function sendEmail(){
  const body=buildContent();
  const subject=`【${RM[cur].label} 中控交接清單】${gv('eventDate')} ${gv('eventName')}`;
  const fb=()=>{const ta=document.createElement('textarea');ta.value=body;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta)};
  if(navigator.clipboard?.writeText){navigator.clipboard.writeText(body).catch(fb);}else fb();
  window.open(`mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`,'_blank');
  showToast('📧 已開啟郵件，內容也已複製');
}
function showToast(msg,err){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast'+(err?' err':'')+' show';
  setTimeout(()=>t.classList.remove('show'),2600);
}
